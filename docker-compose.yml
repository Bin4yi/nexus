services:
  chromadb:
    image: chromadb/chroma:latest
    container_name: nexus2-chromadb
    ports:
      - "8001:8000"
    environment:
      CHROMA_SERVER_HOST: "0.0.0.0"
      CHROMA_SERVER_HTTP_PORT: "8000"
      ANONYMIZED_TELEMETRY: "false"
    volumes:
      - nexus2_chroma_data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "echo -e 'GET /api/v2/heartbeat HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' > /dev/tcp/localhost/8000"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7.2-alpine
    container_name: nexus2-redis
    ports:
      - "6380:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - nexus2_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  nexus-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: nexus2-api
    ports:
      - "8081:8080"
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      REDIS_URL: redis://redis:6379/0
      API_KEYS: ""
      REPOS_MIRROR_PATH: /app/mirror
    volumes:
      - ./mirror:/app/mirror:ro
      - nexus2_sqlite_data:/app/data
    depends_on:
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  nexus2_chroma_data:
  nexus2_redis_data:
  nexus2_sqlite_data:
